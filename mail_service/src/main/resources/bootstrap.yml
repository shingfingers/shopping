spring:
  application:
    name: mail_service
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 192.168.0.99:8848
        namespace: ed9ea14a-fdbd-4a79-99ef-847f926b7daa
        file-extension: yaml
        prefix: mail_service
      discovery:
        server-addr: 192.168.0.99:8848
        namespace: ed9ea14a-fdbd-4a79-99ef-847f926b7daa
  config:
    import:
      - optional:nacos:mail_service-dev.yaml
dubbo:
  scan:
    base-packages: com.bk.common,com.bk.mail_service
  protocol:
    prefer-serialization: hessian2
  provider:
    serialization: hessian2
    timeout: 30000  # 30秒超时（邮件发送需要时间）
logging:
  level:
    com.alibaba.nacos: DEBUG
