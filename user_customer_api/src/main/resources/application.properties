spring.application.name=user_customer_api

# Redis 配置
spring.data.redis.host=192.168.0.99
spring.data.redis.port=6379

# Dubbo 序列化：允许自定义异常(BusException)跨 Dubbo 原样传输
dubbo.application.serialize-check-status=DISABLE
dubbo.application.check-serializable=false
dubbo.protocol.prefer-serialization=hessian2
