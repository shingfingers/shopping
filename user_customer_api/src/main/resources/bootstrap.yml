spring:
  application:
    name: user_customer_api
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 192.168.0.99:8848
        namespace: ed9ea14a-fdbd-4a79-99ef-847f926b7daa
        file-extension: yaml
        prefix: user_customer_api
      discovery:
        server-addr: 192.168.0.99:8848
        namespace: ed9ea14a-fdbd-4a79-99ef-847f926b7daa
  config:
    import:
      - optional:nacos:user_customer_api-dev.yaml
logging:
  level:
    com.alibaba.nacos: DEBUG

dubbo:
  protocol:
    prefer-serialization: hessian2
  consumer:
    check: false
    timeout: 30000  # 30秒超时（邮件发送需要更长时间）
